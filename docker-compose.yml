services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartroom_app
    restart: unless-stopped
    ports:
      - "8088:8000"
      - "8085:8085"
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      PHP_CLI_SERVER_WORKERS: "4"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quan_ly_nha_tro
      DB_USERNAME: smartroom
      DB_PASSWORD: smartroom
      APP_URL: http://localhost:8088
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: smartroom
      REVERB_APP_KEY: smartroom-key
      REVERB_APP_SECRET: smartroom-secret
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8085
      REVERB_SCHEME: http
      VITE_REVERB_APP_KEY: smartroom-key
      VITE_REVERB_HOST: 127.0.0.1
      VITE_REVERB_PORT: 8085
      VITE_REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: smartroom_mysql
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: quan_ly_nha_tro
      MYSQL_USER: smartroom
      MYSQL_PASSWORD: smartroom
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer_cache:
  mysql_data:
